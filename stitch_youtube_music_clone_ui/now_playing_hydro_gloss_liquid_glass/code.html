<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>YouTube Music - Now Playing</title>
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            yt: {
              black: '#030303',
              dark: '#0f0f0f',
              surface: '#212121',
              lightDark: '#282828',
              red: '#FF0000',
              secondary: '#AAAAAA',
              muted: '#717171',
              border: '#383838'
            }
          },
          fontFamily: {
            sans: ['Roboto', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Helvetica Neue', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- Material Symbols Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style data-purpose="custom-styling">
    /* Ambient glow simulation matching dynamic player background */
    .ambient-glow {
      background: radial-gradient(circle at 50% 30%, rgba(88, 28, 135, 0.45) 0%, rgba(136, 19, 55, 0.25) 45%, rgba(3, 3, 3, 0) 80%);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
    }
    .material-symbols-outlined.fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Smooth touch tap highlights removal */
    * {
      -webkit-tap-highlight-color: transparent;
    }

    /* Apple Hydro-Gloss Bulbous Liquid Glass Styles */
    .liquid-glass-droplet {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.04) 50%, rgba(255, 255, 255, 0.08) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.37),
        0 0 1px 1px rgba(255, 255, 255, 0.2),
        inset 0 2px 4px rgba(255, 255, 255, 0.65),
        inset 0 -2px 4px rgba(0, 0, 0, 0.4);
    }
    .liquid-glass-droplet:active {
      transform: scale(0.94);
      box-shadow: 
        0 4px 16px rgba(0, 0, 0, 0.4),
        0 0 1px 1px rgba(255, 255, 255, 0.25),
        inset 0 1px 3px rgba(255, 255, 255, 0.4),
        inset 0 -1px 3px rgba(0, 0, 0, 0.5);
    }

    /* Hydro-Acrylic Luminous Glass Lens (Play Button) */
    .hydro-glass-master-play {
      background: radial-gradient(circle at 35% 25%, #ffffff 0%, #f0eff5 45%, #d5d3e0 80%, #bdb9ce 100%);
      box-shadow: 
        0 14px 36px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.6),
        inset 0 3px 6px rgba(255, 255, 255, 0.95),
        inset 0 -4px 8px rgba(90, 70, 140, 0.35);
      position: relative;
    }
    .hydro-glass-master-play::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 12%;
      right: 12%;
      height: 40%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 9999px;
      pointer-events: none;
    }

    /* Floating Liquid Segmented Slider Chamber */
    .liquid-glass-chamber {
      background: rgba(20, 10, 32, 0.5);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 
        inset 0 1px 3px rgba(255, 255, 255, 0.2),
        inset 0 -1px 3px rgba(0, 0, 0, 0.6),
        0 4px 14px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .liquid-slider-active {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.1) 100%);
      box-shadow: 
        0 2px 8px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.35),
        inset 0 1.5px 3px rgba(255, 255, 255, 0.7),
        inset 0 -1.5px 3px rgba(0, 0, 0, 0.3);
    }

    /* Polished Double-Rim Specular Capsule */
    .liquid-specular-capsule {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 
        0 6px 20px rgba(0, 0, 0, 0.3),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.5),
        inset 0 -1.5px 3px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body class="bg-black text-white flex justify-center items-center min-h-screen antialiased selection:bg-red-600 selection:text-white">
<!-- BEGIN: MobileDeviceFrame -->
<div class="relative w-full max-w-[425px] h-[100dvh] max-h-[915px] bg-[#030303] overflow-hidden flex flex-col justify-between shadow-2xl select-none sm:rounded-[36px] sm:border sm:border-neutral-800" data-purpose="player-container" style="background: radial-gradient(circle at 50% 30%, rgb(59, 16, 84) 0%, rgb(26, 5, 38) 55%, rgb(13, 2, 20) 100%);">
<!-- Ambient glowing background -->
<div aria-hidden="true" class="absolute inset-0 pointer-events-none ambient-glow z-0" style="background: radial-gradient(circle at 50% 35%, rgba(147, 51, 234, 0.45) 0%, rgba(88, 28, 135, 0.35) 40%, rgba(26, 5, 38, 0.8) 85%);"></div>
<!-- BEGIN: StatusBar -->
<header class="relative z-10 flex justify-between items-center px-6 pt-3 pb-1 text-xs font-medium text-neutral-300" data-purpose="status-bar">
<span class="tracking-tight font-semibold text-[14px]">=6:13</span>
<!-- Right Status Icons -->
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[15px] leading-none">wifi</span>
<span class="material-symbols-outlined text-[15px] leading-none">signal_cellular_4_bar</span>
<!-- Battery Icon & Percentage -->
<div class="flex items-center gap-1 ml-0.5 font-semibold text-[11px] leading-none">
<span class="">43%</span>
<span class="material-symbols-outlined text-[16px] -rotate-90 leading-none">battery_full</span>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: PlayerTopAppBar -->
<nav class="relative z-10 flex items-center justify-between px-4 py-2" data-purpose="top-navigation">
<!-- Minimize chevron button with liquid glass droplet styling -->
<button aria-label="Minimize Player" class="w-10 h-10 flex items-center justify-center rounded-full liquid-glass-droplet transition-transform">
<span class="material-symbols-outlined text-white text-[24px]">expand_more</span>
</button>
<!-- Centered Song/Video Segmented Pill Switch with Milled Liquid Glass Chamber -->
<div class="flex items-center liquid-glass-chamber p-1 rounded-full gap-0.5" data-purpose="segmented-toggle">
<button class="liquid-slider-active px-4 py-1 rounded-full text-white font-medium text-[12px] tracking-wide transition-all">Song</button>

</div>
<!-- More options overflow icon with liquid glass droplet styling -->
<button aria-label="More options" class="w-10 h-10 flex items-center justify-center rounded-full liquid-glass-droplet transition-transform">
<span class="material-symbols-outlined text-white text-[22px]">more_vert</span>
</button>
</nav>
<!-- END: PlayerTopAppBar -->
<!-- BEGIN: MainContentSection -->
<main class="relative z-10 flex-1 flex flex-col justify-evenly px-6 overflow-hidden">
<!-- Album Artwork Visual Container -->
<section class="flex items-center justify-center w-full px-2 py-1" data-purpose="album-artwork-display">
<div class="relative w-full aspect-square max-w-[340px] rounded-2xl overflow-hidden shadow-2xl shadow-black/80 ring-1 ring-white/10 group">
<!-- Album Artwork Image from DataStore -->
<img alt="Album Artwork - Never Giving Up by M.M. Keeravaani" class="w-full h-full object-cover object-center transform transition duration-500 group-hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDHylDh9TgyiyiN-S3kB5QZAOOX7AmOf_amSsfBvRkG6KBHrnsO8g5mufijkjf2PfG3TOtaxsh3TzWcK2mZS4zUNJzEo09imF2QXNN6rxIO9XSK4Ath3plVDU9eBK_dE_i7bfJgWXn_Ne1Y30Tqdu9Kr0wuxZv5oSdlQ2gKHqIGrlmp-BupUZ1JPc_dW7DtKTy7CywzPEHSDQqjQcbVFpYSA8hd9o5RCtRnj-Twohe1EGlKHIMED-1KJWO1sYXV8EEcYBGGhU8LiKBSSA">
</div>
</section>
<!-- Track Information and Reaction Actions -->
<section class="flex items-center justify-between mt-2 mb-1" data-purpose="track-metadata-actions">
<!-- Left: Track Title & Artist Info -->
<div class="flex flex-col min-w-0 pr-4">
<h1 class="text-[21px] font-bold text-white tracking-normal leading-tight truncate">Heat Waves</h1>
<h2 class="text-[14px] text-neutral-400 font-normal truncate mt-0.5">Glass Animals</h2>
</div>
<!-- Right: Like, Dislike & Save Actions - Polished Liquid Glass Capsule -->
<div class="flex items-center gap-1 shrink-0 text-white liquid-specular-capsule px-1.5 py-1 rounded-full">
<button aria-label="Dislike" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 active:scale-90 transition">
<span class="material-symbols-outlined text-[20px]">thumb_down</span>
</button>
<div class="w-[1px] h-4 bg-white/15 mx-0.5"></div>
<button aria-label="Like" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 active:scale-90 transition">
<span class="material-symbols-outlined text-[20px]">thumb_up</span>
</button>
<div class="w-[1px] h-4 bg-white/15 mx-0.5"></div>
<button aria-label="Save to playlist" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/10 active:scale-90 transition">
<span class="material-symbols-outlined text-[20px]">bookmark_border</span>
</button>
</div>
</section>
<!-- BEGIN: ScrubBarAndTimestamps -->
<section class="w-full mt-1" data-purpose="playback-progress">
<!-- Progress Bar Slider -->
<div class="relative w-full h-6 flex items-center cursor-pointer group">
<!-- Background track -->
<div class="w-full h-[3px] bg-white/20 rounded-full overflow-hidden group-hover:h-[5px] transition-all">
<!-- Filled Played Bar -->
<div class="h-full bg-red-600 rounded-full w-[36%] relative"></div>
</div>
<!-- Scrubber Handle Knob -->
<div class="absolute left-[36%] -translate-x-1/2 w-3.5 h-3.5 bg-red-600 rounded-full shadow-md scale-100 group-hover:scale-125 transition-transform"></div>
</div>
<!-- Timestamps Row -->
<div class="flex justify-between text-[11px] font-medium text-neutral-400 tabular-nums -mt-1 tracking-wider">
<span class="">1:24</span>
<span class="">3:45</span>
</div>
</section>
<!-- END: ScrubBarAndTimestamps -->
<!-- BEGIN: TransportPlaybackControls -->
<section class="flex items-center justify-between px-2 my-1" data-purpose="master-playback-controls">
<!-- Shuffle button (Tumbled glass pebble) -->
<button aria-label="Shuffle" class="w-11 h-11 flex items-center justify-center rounded-full text-neutral-300 hover:text-white liquid-glass-droplet transition">
<span class="material-symbols-outlined text-[22px]">shuffle</span>
</button>
<!-- Previous track button (Tumbled glass pebble) -->
<button aria-label="Previous Track" class="w-12 h-12 flex items-center justify-center rounded-full text-white liquid-glass-droplet transition">
<span class="material-symbols-outlined text-[32px] fill-icon">skip_previous</span>
</button>
<!-- Large Master Play/Pause Button (Hydro-Acrylic luminous glass sphere/lens) -->
<button aria-label="Play" class="w-[70px] h-[70px] flex items-center justify-center hydro-glass-master-play text-[#161026] rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[40px] fill-icon ml-1">play_arrow</span>
</button>
<!-- Next track button (Tumbled glass pebble) -->
<button aria-label="Next Track" class="w-12 h-12 flex items-center justify-center rounded-full text-white liquid-glass-droplet transition">
<span class="material-symbols-outlined text-[32px] fill-icon">skip_next</span>
</button>
<!-- Repeat button (Tumbled glass pebble) -->
<button aria-label="Repeat" class="w-11 h-11 flex items-center justify-center rounded-full text-neutral-300 hover:text-white liquid-glass-droplet transition">
<span class="material-symbols-outlined text-[22px]">repeat</span>
</button>
</section>
<!-- END: TransportPlaybackControls -->
<!-- BEGIN: AudioRoutingRow -->
<section class="flex items-center justify-between text-xs text-neutral-400 pt-1 pb-2" data-purpose="audio-device-output">
<!-- Device Pill Capsule -->
<button class="liquid-specular-capsule flex items-center gap-2 hover:text-white transition-colors py-1.5 px-3.5 rounded-full active:scale-95">
<span class="material-symbols-outlined text-[17px] text-white">cast</span>
<span class="font-medium text-[13px] text-neutral-200">Living Room Speaker</span>
</button>
<!-- Share Button Droplet -->
<button aria-label="Share" class="liquid-glass-droplet w-9 h-9 flex items-center justify-center rounded-full text-white transition-transform active:scale-95">
<span class="material-symbols-outlined text-[18px]">share</span>
</button>
</section>
<!-- END: AudioRoutingRow -->
</main>
<!-- END: MainContentSection -->
<!-- BEGIN: BottomSheetPeek -->
<footer class="relative z-20 bg-[#161616] rounded-t-[24px] border-t border-white/10 shadow-[0_-8px_30px_rgba(0,0,0,0.8)] pb-6 pt-2 px-6" data-purpose="docked-bottom-sheet">
<!-- Drag Handle Indicator -->
<div class="w-full flex justify-center py-1 cursor-grab active:cursor-grabbing">
<div class="w-8 h-1 bg-neutral-600 rounded-full"></div>
</div>
<!-- Bottom Sheet Navigation Tabs -->
<div class="flex items-center justify-between text-center pt-2 pb-1 font-semibold tracking-wider text-[13px]">
<!-- UP NEXT Active Tab with Frosted Glass Pill -->
<button class="flex-1 text-white py-1 flex items-center justify-center gap-1.5">
<span class="tracking-widest">UP NEXT</span>
<span class="bg-white/15 text-[10px] font-bold px-1.5 py-0.2 rounded-full text-neutral-300">48</span>
</button>
<!-- RELATED Tab -->
<button class="flex-1 text-neutral-400 hover:text-white py-1 tracking-widest transition-colors">
          RELATED
        </button>
</div>
</footer>
<!-- END: BottomSheetPeek -->
</div>
<!-- END: MobileDeviceFrame -->




</body></html>
