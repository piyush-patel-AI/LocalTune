<style data-purpose="hydro-gloss-effects">
    .hydro-glass-bar {

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    
    .hydro-glass-pill {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%), rgba(26, 29, 38, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.15), 0 4px 16px rgba(0,0,0,0.4);

    .hydro-key {
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.08s ease;
    }

    .hydro-key:active {
      transform: translateY(1px) scale(0.97);
      background-color: #434854;
    }

<!-- Interactive script to allow clicking history items -->
<script data-purpose="search-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const searchPillText = document.querySelector('[data-purpose="search-header"] span.whitespace-nowrap');
      const historyItems = document.querySelectorAll('[data-purpose="history-item"]');
      
      historyItems.forEach(item => {
        item.addEventListener('click', () => {
          const queryText = item.querySelector('span').innerText.trim();
          if (searchPillText) {
            searchPillText.innerText = queryText;
            searchPillText.classList.remove('text-[#cfd3db]');
            searchPillText.classList.add('text-white', 'font-medium');
          }
        });
      });
    });
  </script>
