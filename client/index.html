<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          if (window.location.hostname.includes('ngrok') && !window.location.search.includes('ngrok-skip-browser-warning')) {
            var url = new URL(window.location.href);
            url.searchParams.set('ngrok-skip-browser-warning', '69420');
            window.location.replace(url.toString());
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="../Assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octave — Personal Music Workstation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  </body>
</html>
